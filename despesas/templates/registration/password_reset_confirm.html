{% extends "base.html" %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock extra_css %}
{% block content %}
    <div class="auth-wrapper">
        <div class="auth-container fade-in">
            <h1>🔒 Nova Password</h1>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Nova Password</label>
                    {{ form.new_password1 }}
                </div>
                <div class="form-group">
                    <label>Confirmar Password</label>
                    {{ form.new_password2 }}
                </div>
                <button type="submit" class="submit-btn">Alterar Password</button>
            </form>
        </div>
    </div>
{% endblock content %}
