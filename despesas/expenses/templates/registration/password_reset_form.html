{% extends "base.html" %}
{% block content %}
    <div class="auth-container fade-in">
        <h1>🔑 Recuperar Password</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Email</label>
                {{ form.email }}
            </div>
            <button type="submit" class="submit-btn">Enviar Email</button>
        </form>
    </div>
{% endblock content %}
